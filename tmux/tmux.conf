# Ref: https://gist.github.com/adibhanna/979461c5f7d906daf24925fbd9b255eb

# --------------------- Configuration

# Start window and pane numbering from 1 for easier switching
set -g base-index 1
setw -g pane-base-index 1

set -g mouse on

# Renumber windows when one is removed.
set -g renumber-windows on

# Monitor window activity to display in the status bar
setw -g monitor-activity on

set -ag terminal-overrides ",xterm-256color:RGB"

# Impede o tmux de setar o título da janela do terminal
set -g set-titles off

# ── Clipboard (macOS) ────────────────────────────────
set -g set-clipboard on

# ── Selection highlight (choose-tree, choose-buffer, copy-mode) ──
set -g mode-style 'fg=#D8DEE9,bg=#3B4252'

# ── Menus (tmux 3.3+) ──

# Command prompt & message area (prefix + :)
set -g message-style 'fg=#D8DEE9,bg=#3B4252'  # snow storm on polar night 1
set -g message-command-style 'fg=#D8DEE9,bg=#3B4252'

# Menus (tmux 3.3+) – right-click or display-menu
set -g menu-style 'fg=#D8DEE9,bg=#2E3440'     # light text on dark bg
set -g menu-border-style 'fg=#81A1C1'          # blue border

# Pane numbers (prefix + q)
set -g display-panes-colour '#4C566A'          # dim blue-grey
set -g display-panes-active-colour '#88C0D0'   # frost cyan

# (Optional) Popup windows if you use them
set -g popup-style 'fg=#D8DEE9,bg=#000000'
set -g popup-border-style 'fg=#ffffff'

# ── Pane borders ─────────────────────────────────────
set -g pane-border-style 'fg=#3B4252'          # borda inativa — polar night
set -g pane-active-border-style 'fg=#80A0FF'   # borda ativa — seu tom de azul

# --------------------- Status line

# Status line customisation
set-option -g status-left-length 100
set-option -g status-left " #{session_name}  "
set-option -g status-style "fg=#ffffff bg=default" # default will set the background to transparent

# Highlight current window
set-window-option -g window-status-current-format '#I:#W#F'
set-window-option -g window-status-current-style fg=black,bg=white,bold

# --------------------- Key Bindings

# Pane navigation
bind-key -r h select-pane -L  # Left
bind-key -r j select-pane -D  # Down
bind-key -r l select-pane -R  # Right
bind-key -r k select-pane -U  # Up

# Resize panes more easily
bind H resize-pane -L 5
bind L resize-pane -R 5
bind J resize-pane -D 5
bind K resize-pane -U 5

# allow to copy to system clipboard
bind-key y run -b "tmux show-buffer | pbcopy" \; display-message "copied tmux buffer to system clipboard"

# copy with mouse selection straight to the system clipboard
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"

# show a promp to kill a window by id with prefix+X
bind-key X command-prompt -p "kill window: " "kill-window -t '%%'"

# --------------------- Key Bindings - Open Applications

# open an application in a new window with prefix+o, and allow me to provide the app name
bind-key o command-prompt -p "open app: " "new-window '%%'"

# Toggle Term
bind-key -n 'C-g' run-shell -b "${HOME}/.config/tmux/toggle_term.sh"

# -- Integrationg Neovim and Ghostty Quick Terminal ---------------------
